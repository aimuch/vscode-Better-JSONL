<script>
  // Stands in for the VS Code webview API. Tests read window.__posted.
  window.__posted = [];
  window.__state = undefined;
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => window.__posted.push(JSON.parse(JSON.stringify(m))),
    getState: () => window.__state,
    setState: (s) => (window.__state = s),
  });
  window.harness = {
    lastReport() {
      for (let i = window.__posted.length - 1; i >= 0; i--) if (window.__posted[i].type === 'report') return window.__posted[i].report;
      return undefined;
    },
    posted(type) {
      return window.__posted.filter((m) => m.type === type);
    },
    send(msg) {
      window.postMessage(msg, '*');
    },
    async load(file, opts = {}) {
      const text = opts.text ?? (await (await fetch('/test/fixtures/' + file)).text());
      const isJsonl = /\.(jsonl|ndjson)$/.test(file);
      window.harness.send({
        type: 'init',
        doc: { uri: 'file:///fixtures/' + file, fileName: file, languageId: isJsonl ? 'jsonl' : 'json', isJsonl, host: 'preview' },
        text,
        version: 1,
        config: Object.assign({ defaultView: 'formatted', expandMode: 'focus', indent: 2, graphMaxNodes: 1500, syncSelection: true, theme: 'vscode', wordWrap: 'followEditor', wrap: false, formatDocument: false, expandReminder: true, language: 'auto', lang: 'en', vscodeLanguage: 'en' }, opts.config || {}),
      });
    },
  };
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get('theme') || 'dark';
</script>
</head>
<body>
<div id="app"></div>
<script>
  document.body.className = 'vscode-' + (params.get('theme') || 'dark');
</script>
<script src="/dist/webview.js"></script>
<script>
  if (params.get('file')) window.harness.load(params.get('file'));
</script>
</body>
