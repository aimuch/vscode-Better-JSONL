name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Unit tests
        run: npm run test:unit

      # VS Code needs a display on Linux: xvfb gives it one.
      - name: Extension host E2E (downloads VS Code)
        env:
          VSCODE_DOWNLOAD: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e:host
          else
            npm run test:e2e:host
          fi

      # The UI checks drive the macOS application bundle, so they and the package step run there.
      - name: Package VSIX and UI E2E in a real VS Code window
        if: runner.os == 'macOS'
        run: |
          app="$(ls -d .vscode-test/vscode-*/Visual\ Studio\ Code.app 2>/dev/null | head -n 1)"
          [ -n "$app" ] || app="/Applications/Visual Studio Code.app"
          echo "Using $app"
          VSCODE_APP="$app" npm run test:e2e:ui

      - name: Webview E2E (Chrome)
        run: npm run test:e2e:web

      - name: Upload VSIX
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # package.json says VS Code 1.85 or newer: the host tests run on that version too.
  oldest-vscode:
    name: Extension host on VS Code 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Extension host E2E on VS Code 1.85.2
        env:
          VSCODE_DOWNLOAD: '1'
          VSCODE_VERSION: '1.85.2'
        run: xvfb-run -a npm run test:e2e:host

  release:
    name: GitHub Release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, oldest-vscode]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    # Publishing to the marketplaces runs only when the repository has these secrets.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-vsix

      - name: Create or update the release with the offline installer
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating tag ref and replacing offline VSIX asset."
            git push --force origin "$GITHUB_SHA:refs/tags/$tag" || echo "::warning::Could not update tag $tag ref; continuing to upload VSIX."
            gh release upload "$tag" dist-vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating GitHub Release $tag with offline VSIX asset."
            gh release create "$tag" dist-vsix/*.vsix \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Better JSONL $tag" \
              --generate-notes \
              --latest
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the Visual Studio Marketplace
        if: steps.gh_release.outputs.created == 'true' && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath dist-vsix/*.vsix

      - name: Publish to Open VSX
        if: steps.gh_release.outputs.created == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish dist-vsix/*.vsix -p "$OVSX_PAT"
